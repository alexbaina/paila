<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>

<h3 id="msg">Loading...</h3>

<script>
(function () {

    const srv_domain = "armaho.org";

    let path = window.location.pathname;

    if (!path || path === "/") {
        document.body.innerText = "Missing parameter";
        return;
    }

    // 1. 7yd Slash l-lwl w l-lkher ila kanou (Trailing & leading slashes removal)
    let tracking_param = path.replace(/^\/+/, "").replace(/\/+$/, "");

    if (!tracking_param) {
        document.body.innerText = "Missing parameter";
        return;
    }

    const isValid = /^[a-zA-Z0-9-_\/]+$/.test(tracking_param);

    if (!isValid) {
        document.body.innerText = "Invalid parameter";
        return;
    }

    // 2. dir redirect b tariqa mdaabta bla slash zayed f l-akher
    const targetUrl = "http://" + srv_domain + "/" + tracking_param;

    window.location.replace(targetUrl);

})();
</script>

</body>
</html>
